name: CI/CD Bank Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests compile

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fraud detection checks
        run: |
          pip install -r fraud-detection/requirements.txt
          python fraud-detection/fraud_detection.py

  build-and-push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module:
          - discovery-service
          - config-server
          - gateway-service
          - account-service
          - transaction-service
          - notification-service
          - ai-assistant
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.sha }}

  deploy:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy (schematic)
        run: |
          echo "Deploy step (schematic — no real cloud required)"
          echo "1. Pull images from GHCR"
          echo "2. docker compose -f docker-compose.yml pull"
          echo "3. docker compose up -d"
          echo "4. Run smoke tests against gateway :8080"
          echo "Rollback: redeploy previous git SHA tags"
