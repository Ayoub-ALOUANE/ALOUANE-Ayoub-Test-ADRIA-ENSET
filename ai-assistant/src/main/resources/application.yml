server:
  port: 8084

spring:
  application:
    name: ai-assistant

mcp:
  account-url: ${ACCOUNT_URL:http://localhost:8081}
  transaction-url: ${TRANSACTION_URL:http://localhost:8082}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o-mini}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
