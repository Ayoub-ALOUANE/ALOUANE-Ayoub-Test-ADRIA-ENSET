server:
  port: 8082

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true
    path: /graphql
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:}

bank:
  transaction:
    max-amount: 1000
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic:
      transactions-created: bank.transactions.created

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.adria.bank.transaction.service.exception.BusinessException
          - com.adria.bank.transaction.service.exception.TransactionNotFoundException
  timelimiter:
    instances:
      accountService:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
