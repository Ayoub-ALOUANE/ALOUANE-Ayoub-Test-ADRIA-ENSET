server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**,/graphql/accounts/**,/mcp/accounts/**
          filters:
            - RewritePath=/graphql/accounts(?<segment>/?.*), /graphql${segment}
            - RewritePath=/mcp/accounts(?<segment>/?.*), /mcp${segment}
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**,/api/transfers/**,/graphql/transactions/**,/mcp/transactions/**
          filters:
            - RewritePath=/graphql/transactions(?<segment>/?.*), /graphql${segment}
            - RewritePath=/mcp/transactions(?<segment>/?.*), /mcp${segment}
            - name: CircuitBreaker
              args:
                name: transactionCircuitBreaker
                fallbackUri: forward:/fallback/transactions
        - id: ai-assistant
          uri: lb://ai-assistant
          predicates:
            - Path=/api/chat/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
